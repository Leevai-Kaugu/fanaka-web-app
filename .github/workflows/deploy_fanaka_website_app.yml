name: Deploy Fanaka App to EC2

on:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: /home/pipeline/website/prod
  BUILD_DIR: dist

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Nextjs application
        run: npm run build

      - name: Ensure deployment directory exists on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Clean deployment directory on EC2, preserving env.local
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Cleaning deployment directory '${{ env.DEPLOY_DIR }}', preserving 'env.local'..."
            cd ${{ env.DEPLOY_DIR }} || exit 1 # Navigate to the directory, exit if it doesn't exist
            # Find all files and directories directly within DEPLOY_DIR (maxdepth 1, mindepth 1)
            # Exclude anything named 'env.local' (! -name 'env.local')
            # Then, execute 'rm -rf' on each found item
            find . -maxdepth 1 -mindepth 1 ! -name 'env.local' -exec rm -rf {} +
            echo "Clean-up complete."

      - name: Copy built Next.js application files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.BUILD_DIR }}/"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Copy public directory to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/" # This copies your static assets
          target: "${{ env.DEPLOY_DIR }}"

      - name: Copy package.json to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package.json"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Copy package-lock.json to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package-lock.json"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Execute post-deployment commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Next.js app deployed to ${{ env.DEPLOY_DIR }}"

            # Navigate to the deployment directory
            cd ${{ env.DEPLOY_DIR }}

            if ! command -v pm2 &> /dev/null
            then
                echo "PM2 not found, installing..."
                sudo npm install pm2@latest -g
            fi

            echo "Installing production dependencies on EC2..."
            npm install --production

            echo "Starting/restarting Next.js app with PM2..."
            pm2 restart fanaka-next-app || pm2 start npm --name "fanaka-next-app" -- start

            pm2 save

            sudo systemctl reload nginx

            echo "Post-deployment commands completed."

      - name: Verify deployment on EC2
        run: |
          echo "Verifying deployment..."
          curl -I http://${{ secrets.EC2_HOST }}
